name: JRA result intake and Sheets check
on:
  workflow_dispatch:
    inputs:
      result_url:
        description: 'Official JRA result URL for an optional intake dry-run'
        type: string
        required: false
      race_id:
        description: 'Expected race key (YYYY-MM-DD-TRACK-RR)'
        type: string
        required: false
      save_result:
        description: 'Save one complete official result and re-read both ledgers'
        type: boolean
        default: false
  push:
    paths:
      - 'scripts/check_sheets.py'
      - 'scripts/jra_result.py'
      - 'scripts/save_result.py'
      - '.github/workflows/check-sheets.yml'
permissions:
  contents: read
concurrency:
  group: jra-sheets-intake
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-auth requests lxml
      - run: python -m py_compile scripts/check_sheets.py scripts/jra_result.py scripts/save_result.py
      - run: python scripts/check_sheets.py --self-test
      - name: Reconcile one saved result with JRA
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          contains(github.event.head_commit.message, '[verify-jra-source]')
        run: python scripts/check_sheets.py --verify-saved-result
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          JRA_SHEET_ID: ${{ secrets.JRA_SHEET_ID }}
      - run: |
          if [ "$JRA_SAVE_RESULT" = true ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "Result writes require main"
              exit 1
            fi
            python scripts/check_sheets.py --save-official-result "$JRA_RESULT_URL" "$JRA_EXPECTED_RACE"
          elif [ -n "$JRA_RESULT_URL" ] || [ -n "$JRA_EXPECTED_RACE" ]; then
            python scripts/check_sheets.py --official-result "$JRA_RESULT_URL" "$JRA_EXPECTED_RACE"
          else
            python scripts/check_sheets.py
          fi
        if: github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          JRA_SHEET_ID: ${{ secrets.JRA_SHEET_ID }}
          JRA_RESULT_URL: ${{ inputs.result_url }}
          JRA_EXPECTED_RACE: ${{ inputs.race_id }}
          JRA_SAVE_RESULT: ${{ inputs.save_result }}
