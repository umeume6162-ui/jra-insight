name: JRA read-only Sheets check
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/check_sheets.py'
      - '.github/workflows/check-sheets.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-auth requests
      - run: python -m py_compile scripts/check_sheets.py
      - run: python scripts/check_sheets.py --self-test
      - run: python scripts/check_sheets.py
        if: github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          JRA_SHEET_ID: ${{ secrets.JRA_SHEET_ID }}
