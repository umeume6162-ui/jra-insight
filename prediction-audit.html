<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>予想前データ確認 | JRA INSIGHT</title>
<style>
:root { color-scheme: light dark; font-family: system-ui, sans-serif; }
body { max-width: 40rem; margin: auto; padding: 1rem; line-height: 1.6; }
input { display: block; max-width: 100%; margin-block: .5rem 1rem; font-size: 1rem; }
section { border-top: 1px solid currentColor; padding-block: .75rem; }
dl { margin: 0; }
dd { margin: 0 0 .75rem; overflow-wrap: anywhere; }
</style>
<main>
<h1>予想前データ確認</h1>
<label for="report">予想前検査の結果ファイル（JSON）</label>
<input id="report" type="file" accept=".json,application/json">
<p id="status" role="status"></p>
<section id="details" aria-label="馬番別の確認項目" hidden>
<dl id="review"></dl>
</section>
</main>
<script>
"use strict";
const file = document.getElementById("report");
const status = document.getElementById("status");
const details = document.getElementById("details");
const output = document.getElementById("review");
const fields = [
  ["verifyHorseId", "公式馬IDの確認が必要"],
  ["missingLedgerRows", "近走台帳に記録なし"],
  ["reviewHeldForm", "近走の取得時点・出典などの再確認が必要"]
];
const statuses = {
  CANDIDATE_ONLY: "保存済みの近走データを確認しました。総合予想の作成には追加の評価が必要です。",
  HOLD_UNKNOWN_IDENTITY: "予想保留。公式馬IDの確認が必要です。",
  HOLD_INCOMPLETE_FEATURES: "予想保留。必要な近走データが揃っていません。",
  HOLD_UNKNOWN_TIME: "予想保留。発走または予想の時刻が確認できません。",
  HOLD_POST_START: "予想保留。発走時刻以降のデータがあります。",
  HOLD_INCOMPLETE_ROSTER: "予想保留。全頭の出馬表が揃っていません。",
  HOLD_IDENTITY_MISMATCH: "予想保留。出馬表のレースIDまたは馬番を確認してください。"
};
let read = 0;
file.addEventListener("change", async () => {
  const token = ++read;
  details.hidden = true;
  output.replaceChildren();
  status.textContent = "";
  if (!file.files.length) return;
  try {
    const report = JSON.parse(await file.files[0].text());
    if (token !== read) return;
    if (!report || !Object.hasOwn(statuses, report.state) ||
        report.publicationAllowed !== false || report.trainingAllowed !== false) throw new Error();
    const review = report.review;
    if (review && !fields.every(([key]) => Array.isArray(review[key]) &&
        review[key].every(n => Number.isInteger(n) && n >= 1 && n <= 18))) throw new Error();
    status.textContent = statuses[report.state];
    if (!review) return;
    for (const [key, label] of fields) {
      const dt = document.createElement("dt");
      const dd = document.createElement("dd");
      dt.textContent = label;
      dd.textContent = review[key].length ? review[key].map(n => n + "番").join("、") : "該当なし";
      output.append(dt, dd);
    }
    details.hidden = false;
  } catch {
    if (token === read) status.textContent = "予想前検査の結果ファイルを読み取れませんでした。";
  }
});
</script>
</html>
